<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internship Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Internship Registration Form</h2>
    <form action="/submit" method="POST" class="card p-4 shadow-sm bg-white" autocomplete="off">
      
      <div class="row">
        <div class="mb-3 col-md-6">
          <label class="form-label">Student Name</label>
          <input type="text" class="form-control" name="name" placeholder="Student name" required>
        </div>

        <div class="mb-3 col-md-6">
          <label class="form-label">Roll No</label>
          <input type="text" class="form-control" name="roll" placeholder="Roll number" required>
        </div>
      </div>

      <div class="row">
        <div class="mb-3 col-md-6">
          <label class="form-label">Department</label>
          <input type="text" class="form-control" name="department" placeholder="Department" required>
        </div>

        <div class="mb-3 col-md-6">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control" name="company" placeholder="Company name" required>
        </div>
      </div>

      <div class="row">
        <div class="mb-3 col-md-6">
          <label class="form-label">Internship Start Date</label>
          <input type="date" class="form-control" name="start_date" required>
        </div>

        <div class="mb-3 col-md-6">
          <label class="form-label">Internship End Date</label>
          <input type="date" class="form-control" name="end_date" required>
        </div>
      </div>

      <div class="row">
        <div class="mb-3 col-md-6">
          <label class="form-label">Student Email</label>
          <input type="email" class="form-control" name="email" placeholder="Email address" required>
        </div>

        <div class="mb-3 col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" name="phone" placeholder="Phone number">
        </div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary px-5">Submit</button>
      </div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
